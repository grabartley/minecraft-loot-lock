name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck --configuration-cache --build-cache

      - name: Run tests with coverage
        run: ./gradlew check --configuration-cache --build-cache

      - name: Dedicated server smoke boot
        run: timeout 120s ./gradlew runServer --no-daemon --stacktrace --args="nogui" || test $? -eq 124

      - name: Run game tests
        run: ./gradlew runGametestServer --no-daemon --stacktrace
        continue-on-error: true
        timeout-minutes: 10

      - name: Publish unit test report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          detailed_summary: true
          include_passed: true

      - name: Publish game test report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: "**/build/gametest-results.xml"
          detailed_summary: true
          include_passed: true
          check_name: Game Test Report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/

      - name: Determine semantic version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: patch
          release_branches: main

      - name: Build snapshot JAR
        if: github.event_name == 'pull_request'
        run: ./gradlew build -Pversion=1.0.0-SNAPSHOT-${{ github.sha }}

      - name: Build release JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew build -Pversion=${{ steps.semver.outputs.new_version }}

      - name: Upload snapshot JAR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: loot-lock-${{ github.sha }}
          path: build/libs/*.jar

      - name: Create GitHub tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.semver.outputs.new_version }}
          tag_prefix: v

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.new_version }}
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
