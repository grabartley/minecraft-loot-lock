plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '6.25.0'
id 'com.modrinth.minotaur' version '2.9.0'
}

import java.nio.charset.StandardCharsets

version = project.findProperty("version") ?: project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.terraformersmc.com/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"loot-lock" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:7.2.2"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.register("verifyMainSourceSideSafety") {
	group = "verification"
	description = "Fails if src/main references client-only classes"
	def mainJavaFiles = fileTree("src/main/java") {
		include "**/*.java"
	}
	inputs.files(mainJavaFiles)

	doLast {
		def disallowedPatterns = [
			"net.minecraft.client.",
			"com.grahambartley.client."
		]
		def violations = []

		inputs.files.files.each { file ->
			def text = file.getText(StandardCharsets.UTF_8.name())
			disallowedPatterns.each { pattern ->
				if (text.contains(pattern)) {
					violations << "${file}: contains '${pattern}'"
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Main source set side-safety violations found:\n" + violations.join("\n"))
		}
	}
}

tasks.named("check") {
	dependsOn("verifyMainSourceSideSafety")
	dependsOn("spotlessCheck")
}

spotless {
	java {
		target 'src/**/*.java'
		targetExclude 'build/**'
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '**/*.gradle', '**/*.md', '**/.gitignore'
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {
projectId = 'loot-lock'
versionNumber = System.getenv('MOD_VERSION') ?: project.version
versionName = 'LootLock v' + (System.getenv('MOD_VERSION') ?: project.version)
versionType = System.getenv('MOD_RELEASE_TYPE') ?: 'alpha'
uploadFile = remapJar
gameVersions = ['1.20.1']
loaders = ['fabric']
changelog = rootProject.file('release-notes.md').exists()
	? rootProject.file('release-notes.md').text
	: 'No changelog provided.'
dependencies {
	required.project 'fabric-api'
	optional.project 'modmenu'
}
}
