plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'jacoco'
	id 'checkstyle'
	id 'com.modrinth.minotaur' version '2.9.0'
}

import java.nio.charset.StandardCharsets

// findProperty("version") can never fall through: Project.version defaults to the string "unspecified"
version = gradle.startParameter.projectProperties.getOrDefault("version", project.mod_version)
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.blamejared.com" }
	maven { url = "https://maven.shedaniel.me" }
	maven { url = "https://maven.architectury.dev" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"loot-lock" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs "--username", "DevPlayer"
		}
		gametest {
			server()
			name "Game Test"
			vmArg "-ea"
			runDir "build/gametest"
			programArgs "--nogui"
			property "fabric-api.gametest", "true"
			property "fabric-api.gametest.report-file", "${project.buildDir}/gametest-results.xml"
		}
		gametestServer {
			inherit gametest
			name "Game Test Server"
		}
	}
}

sourceSets {
	clientTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	clientTestImplementation.extendsFrom testImplementation
	clientTestRuntimeOnly.extendsFrom testRuntimeOnly
}

def recipeViewerApiJars = {
	configurations.clientCompileClasspath.filter {
		it.name ==~ /(jei-.*-api.*|RoughlyEnoughItems-api-fabric.*|basic-math.*)\.jar/
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params:${project.junit_version}"
	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	testImplementation "org.mockito:mockito-junit-jupiter:${project.mockito_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	clientTestRuntimeOnly files(recipeViewerApiJars)

}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
	finalizedBy jacocoTestReport
}

tasks.register("clientTest", Test) {
	finalizedBy jacocoTestReport
	group = "verification"
	description = "Runs client-side unit tests."
	useJUnitPlatform()
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

jacoco {
	toolVersion = "0.8.12"
}

checkstyle {
	toolVersion = project.checkstyle_version
	configFile = rootProject.file("config/checkstyle/checkstyle.xml")
	maxWarnings = 0
	maxErrors = 0
}

jacocoTestReport {
	dependsOn test, clientTest
	executionData test, clientTest
	sourceSets sourceSets.main, sourceSets.client
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.register("verifyMainSourceSideSafety") {
	group = "verification"
	description = "Fails if src/main references client-only classes"
	def mainJavaFiles = fileTree("src/main/java") {
		include "**/*.java"
	}
	inputs.files(mainJavaFiles)

	doLast {
		def disallowedPatterns = [
			"net.minecraft.client.",
			"com.grahambartley.lootlock.client."
		]
		def violations = []

		inputs.files.files.each { file ->
			def text = file.getText(StandardCharsets.UTF_8.name())
			disallowedPatterns.each { pattern ->
				if (text.contains(pattern)) {
					violations << "${file}: contains '${pattern}'"
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Main source set side-safety violations found:\n" + violations.join("\n"))
		}
	}
}

tasks.named("check") {
	dependsOn("verifyMainSourceSideSafety")
	dependsOn("spotlessCheck")
	dependsOn("clientTest")
}

spotless {
	java {
		target 'src/**/*.java'
		targetExclude 'build/**'
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '**/*.gradle', '**/*.md', '**/.gitignore'
		targetExclude '.claude/**', '**/.claude/**', 'build/**', '.gradle/**'
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {
	projectId = 'loot-lock'
	versionNumber = project.version.toString()
	versionName = "Loot Lock v${project.version}"
	versionType = System.getenv('MOD_RELEASE_TYPE') ?: 'alpha'
	uploadFile = remapJar
	gameVersions = ['1.21.1']
	loaders = ['fabric']
	changelog = rootProject.file('release-notes.md').exists()
		? rootProject.file('release-notes.md').text
		: 'No changelog provided.'
	dependencies {
		required.project 'fabric-api'
		optional.project 'modmenu'
		optional.project 'jei'
		optional.project 'rei'
	}
}
